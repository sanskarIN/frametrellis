# SPDX-License-Identifier: GPL-3.0-or-later
# Linux and macOS desktop smoke/build coverage for the v1.5 featured release.
# These are DEVELOPMENT artifacts: they rely on the system/CI Qt, MLT and codec
# packages and must not be attached to stable GitHub Releases as portable apps.
name: Linux and macOS desktops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.8.3'
  MLT_VERSION: 'v7.22.0'
  # Avoid updating the entire Homebrew registry on each native macOS build;
  # slow Intel runners otherwise spend most of their time in brew update.
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  linux:
    name: Linux x64 (build, GUI tests and install smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev libavdevice-dev \
            libswscale-dev libswresample-dev libsdl2-dev \
            libgl1-mesa-dev libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-noto-core
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Cache MLT
        id: mlt-cache
        uses: actions/cache@v5
        with:
          path: ~/mlt
          key: desktop-mlt-${{ env.MLT_VERSION }}-ubuntu-24.04-v1
      - name: Build MLT with FFmpeg and compositor modules
        if: steps.mlt-cache.outputs.cache-hit != 'true'
        run: scripts/build-mlt.sh "${{ env.MLT_VERSION }}" "$HOME/mlt"
      - name: Configure full editor
        run: cmake --preset linux -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$HOME/mlt"
      - name: Build full editor and renderer
        run: cmake --build --preset linux --parallel 3
      - name: Test GUI, render, and project functions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux --output-on-failure
      - name: Run renderer and GUI smoke from build tree
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          ./build/linux/bin/frametrellis-render --self-test "$RUNNER_TEMP/linux-smoke"
          ./build/linux/bin/frametrellis --screenshot "$RUNNER_TEMP/linux-gui.png" \
            --screenshot-delay 1000 "$RUNNER_TEMP/linux-smoke/self-test.ftproj"
          test -s "$RUNNER_TEMP/linux-gui.png"
      - name: Stage unbundled development installation
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/FrameTrellis-linux-x64-development"
          cmake --install build/linux --prefix "$stage"
          test -x "$stage/bin/frametrellis"
          test -x "$stage/bin/frametrellis-render"
          test -s "$stage/share/applications/frametrellis.desktop"
          test -s "$stage/share/mime/packages/frametrellis.xml"
          test -s "$stage/share/icons/hicolor/scalable/apps/frametrellis.svg"
          grep -Fq 'application/x-frametrellis-project' "$stage/share/mime/packages/frametrellis.xml"
          grep -Fq '*.ftproj' "$stage/share/mime/packages/frametrellis.xml"
          # This is an UNBUNDLED development installation: the system must
          # provide ABI-compatible MLT/FFmpeg + Qt libraries. CI's MLT lives
          # under $HOME/mlt (not in the distribution's linker cache).
          export LD_LIBRARY_PATH="$HOME/mlt/lib:${LD_LIBRARY_PATH:-}"
          export FRAMETRELLIS_MLT_REPOSITORY="$HOME/mlt/lib/mlt-7"
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software SDL_AUDIODRIVER=dummy
          "$stage/bin/frametrellis-render" --self-test "$RUNNER_TEMP/linux-installed-render"
          test -s "$RUNNER_TEMP/linux-installed-render/self-test-export.mp4"
          "$stage/bin/frametrellis" \
            --screenshot "$RUNNER_TEMP/linux-installed-gui.png" \
            --screenshot-delay 1000 "$RUNNER_TEMP/linux-installed-render/self-test.ftproj"
          test -s "$RUNNER_TEMP/linux-installed-gui.png"
          {
            echo "GUI ELF dependency links:"
            ldd "$stage/bin/frametrellis"
            echo "Renderer ELF dependency links:"
            ldd "$stage/bin/frametrellis-render"
          } > "$stage/NATIVE-DEPENDENCIES.txt"
          cat > "$stage/DEVELOPMENT-BUILD.txt" <<'EOF'
          This Linux development build requires compatible Qt 6.8+, MLT 7,
          FFmpeg, SDL2 and desktop system libraries. Libraries installed in a
          nonstandard prefix may require LD_LIBRARY_PATH or ldconfig and the
          corresponding MLT service modules to be configured. It is NOT a
          self-contained AppImage/Flatpak or a stable v1.5.0 release.
          EOF
          tar -czf "$RUNNER_TEMP/FrameTrellis-linux-x64-development.tar.gz" \
            -C "$RUNNER_TEMP" FrameTrellis-linux-x64-development
      - name: Upload Linux development installation
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-development-stage
          path: ${{ runner.temp }}/FrameTrellis-linux-x64-development.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux GUI smoke and CTest logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop-smoke
          path: |
            ${{ runner.temp }}/linux-gui.png
            ${{ runner.temp }}/linux-installed-gui.png
            build/linux/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} (Homebrew, full editor and install)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Install native development dependencies
        run: |
          brew install cmake ninja pkg-config qt mlt sdl2
          cmake --version
          brew list --versions qt mlt sdl2
      - name: Configure native macOS application bundle
        run: |
          cmake --preset macos \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix mlt)"
      - name: Build GUI bundle and render helper
        run: cmake --build --preset macos --parallel 3
      - name: Assert helper is inside app bundle
        run: |
          set -euo pipefail
          bundle="build/macos/bin/frametrellis.app"
          test -x "$bundle/Contents/MacOS/frametrellis"
          test -x "$bundle/Contents/MacOS/frametrellis-render"
          test -x "build/macos/bin/frametrellis-render"
      - name: Exercise the full native test suite
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SDL_AUDIODRIVER: dummy
        run: ctest --preset macos --output-on-failure
      - name: Generate and render a sample project using bundled helper
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          renderer="build/macos/bin/frametrellis.app/Contents/MacOS/frametrellis-render"
          "$renderer" --self-test "$RUNNER_TEMP/macos-smoke"
          test -s "$RUNNER_TEMP/macos-smoke/self-test.ftproj"
          test -s "$RUNNER_TEMP/macos-smoke/self-test-export.mp4"
      - name: Stage development .app and documented Homebrew requirements
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/FrameTrellis-macos-${{ matrix.arch }}-development"
          cmake --install build/macos --prefix "$stage"
          test -x "$stage/frametrellis.app/Contents/MacOS/frametrellis"
          test -x "$stage/frametrellis.app/Contents/MacOS/frametrellis-render"
          # Finder-style installed bundle layout, not the original build tree.
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software SDL_AUDIODRIVER=dummy \
            "$stage/frametrellis.app/Contents/MacOS/frametrellis" \
            --screenshot "$RUNNER_TEMP/macos-installed-gui.png" \
            --screenshot-delay 1000 "$RUNNER_TEMP/macos-smoke/self-test.ftproj"
          test -s "$RUNNER_TEMP/macos-installed-gui.png"
          {
            echo "GUI Mach-O dependencies:"
            otool -L "$stage/frametrellis.app/Contents/MacOS/frametrellis"
            echo "Renderer Mach-O dependencies:"
            otool -L "$stage/frametrellis.app/Contents/MacOS/frametrellis-render"
          } > "$stage/NATIVE-DEPENDENCIES.txt"
          cat > "$stage/DEVELOPMENT-BUILD.txt" <<'EOF'
          This macOS development .app requires Homebrew Qt 6, MLT 7,
          FFmpeg, and SDL2. The native dependencies are NOT bundled.
          This is NOT a signed/notarized self-contained macOS installer or
          a stable v1.5.0 release. See docs/development/building.md.
          EOF
          tar -czf "$RUNNER_TEMP/FrameTrellis-macos-${{ matrix.arch }}-development.tar.gz" \
            -C "$RUNNER_TEMP" "FrameTrellis-macos-${{ matrix.arch }}-development"
      - name: Upload macOS development bundle (requires Homebrew)
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-homebrew-development
          path: ${{ runner.temp }}/FrameTrellis-macos-${{ matrix.arch }}-development.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-ctest-logs
          path: |
            build/macos/Testing/Temporary/
            ${{ runner.temp }}/macos-installed-gui.png
          if-no-files-found: ignore
          retention-days: 14
