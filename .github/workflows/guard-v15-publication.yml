# SPDX-License-Identifier: GPL-3.0-or-later
# Read-only audit of the historical v1.5.0 owner-approval markers.
# Never create, publish, unpublish, draft, delete, or edit any release.
# GitHub release visibility is controlled manually by the repository owner.
name: Audit v1.5.0 publication (read-only)

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-publication-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Report v1.5.0 publication marker status (never mutate)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.tag_name == 'v1.5.0') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Inspect release and report owner-approval evidence without edits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$EVENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the manual audit from main only"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$EVENT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Release event has no valid release ID"
              exit 1
            }
            release_id="$EVENT_RELEASE_ID"
          else
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.5.0" --jq '.id')"
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Could not resolve the existing v1.5.0 release ID"
              exit 1
            }
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          output="$(python3 packaging/release_publication_guard.py --release-json release.json)"
          printf '%s\n' "$output"
          decision="${output#decision=}"
          case "$decision" in
            ignore|already-draft|approved-source-build|approved-three-platform)
              echo "v1.5.0 publication audit: $decision"
              ;;
            owner-review-required)
              echo "::warning::Published v1.5.0 has missing, partial, or conflicting historical approval markers. Review manually; this workflow does not modify any release."
              ;;
            *)
              echo "::error::Unknown audit decision: $decision"
              exit 1
              ;;
          esac

          {
            echo "### FrameTrellis v1.5.0 publication audit"
            echo
            echo "- Release ID: $release_id"
            echo "- Decision: $decision"
            echo "- Result: read-only audit; no release state changes"
            echo "- Publication and unpublication require an explicit owner action."
          } >> "$GITHUB_STEP_SUMMARY"
