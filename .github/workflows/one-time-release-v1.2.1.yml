# SPDX-License-Identifier: GPL-3.0-or-later
# One-time bridge for publishing v1.2.1 without a personal access token.
# This file must be removed from main after the verified release succeeds.
name: One-time v1.2.1 release trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-release-v1.2.1.yml"
      - "CMakeLists.txt"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Tag the audited commit and start verified publication
    if: github.repository == 'sanskarIN/frametrellis'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check the immutable v1.2.1 source version and notes
        run: |
          set -euo pipefail
          grep -Pzq 'project\(FrameTrellis\s+VERSION\s+1\.2\.1\s' CMakeLists.txt
          test -s docs/releases/v1.2.1.md
          if grep -qiE '^<!-- *draft' docs/releases/v1.2.1.md; then
            echo "::error::Release notes are marked draft"
            exit 1
          fi
      - name: Create release tag and dispatch the verified publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::main moved since the audited push; refusing to tag stale source"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" >/dev/null 2>&1; then
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq '.object.sha')"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v1.2.1 tag already points at another commit"
              exit 1
            fi
            echo "v1.2.1 already targets this commit"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v1.2.1' -f sha="$GITHUB_SHA"
          fi
          # Actions started using GITHUB_TOKEN do not recursively trigger a tag-push
          # workflow. Dispatch the explicitly published release build instead.
          gh workflow run release.yml --ref main -f publish=true
          echo "v1.2.1 is tagged; publication is delegated to release.yml verification."
