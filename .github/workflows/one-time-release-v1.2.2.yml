# One-time v1.2.2 release dispatcher. Remove this workflow after verified publication.
# The permanent release.yml workflow builds, tests, verifies and publishes packages.
name: One-time v1.2.2 release trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-release-v1.2.2.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Tag audited v1.2.2 and start verified publication
    if: github.repository == 'sanskarIN/frametrellis'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate source version and approved release notes
        run: |
          set -euo pipefail
          grep -Pzq 'project\(FrameTrellis\s+VERSION\s+1\.2\.2\s' CMakeLists.txt
          test -s docs/releases/v1.2.2.md
          if grep -qiE '^<!-- *draft' docs/releases/v1.2.2.md; then
            echo "::error::v1.2.2 notes are still marked draft"
            exit 1
          fi
      - name: Create the immutable tag and dispatch verified release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::main moved; refusing to tag an outdated commit"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.2" >/dev/null 2>&1; then
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.2" --jq '.object.sha')"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v1.2.2 already tags a different source commit"
              exit 1
            fi
            echo "Tag v1.2.2 already references the approved commit."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v1.2.2' -f sha="$GITHUB_SHA"
          fi
          # GITHUB_TOKEN-created tag events do not recursively trigger push workflows.
          # A workflow_dispatch event is allowed and requires the explicit publish flag.
          gh workflow run release.yml --ref main -f publish=true
          echo "v1.2.2 is tagged; release.yml must verify packages before publishing."
