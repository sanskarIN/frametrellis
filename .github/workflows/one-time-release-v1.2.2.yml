# Temporary, version-scoped release bootstrap. Remove after stable publication.
name: One-time v1.2.2 release trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-release-v1.2.2.yml"
      - "CMakeLists.txt"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Tag audited v1.2.2 and dispatch verified release pipeline
    if: github.repository == 'sanskarIN/frametrellis'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version and non-draft notes
        run: |
          set -euo pipefail
          grep -Pzq 'project\(FrameTrellis\s+VERSION\s+1\.2\.2\s' CMakeLists.txt
          test -s docs/releases/v1.2.2.md
          if grep -qiE '^<!-- *draft' docs/releases/v1.2.2.md; then
            echo "::error::The v1.2.2 release notes remain in draft"
            exit 1
          fi
      - name: Tag this main commit and start the verified package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::main moved since merge: refusing to tag stale source"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.2" >/dev/null 2>&1; then
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.2" --jq '.object.sha')"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::v1.2.2 already points at a different commit"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v1.2.2' -f sha="$GITHUB_SHA"
          fi
          # GITHUB_TOKEN pushes do not recursively run tag-push workflows.
          gh workflow run release.yml --ref main -f publish=true
          echo "Publishing is delegated to the tested release.yml workflow"
