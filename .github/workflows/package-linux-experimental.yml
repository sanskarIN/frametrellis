# SPDX-License-Identifier: GPL-3.0-or-later
# EXPERIMENTAL: packaging work only; does NOT publish to GitHub Releases.
name: Experimental Linux AppImage

on:
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'resources/linux/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'packaging/linux/**'
      - '.github/workflows/package-linux-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-experimental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x64 (AppDir / Qt / MLT / codecs / AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt/media build dependencies and AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config file curl patchelf desktop-file-utils \
            libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev libavdevice-dev \
            libswscale-dev libswresample-dev libsdl2-dev \
            libgl1-mesa-dev libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-noto-core
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Cache MLT
        id: cache-mlt
        uses: actions/cache@v5
        with:
          path: ~/mlt
          key: linux-appimage-mlt-v7.22.0-ubuntu-24.04-v1
      - name: Build MLT media modules
        if: steps.cache-mlt.outputs.cache-hit != 'true'
        run: scripts/build-mlt.sh v7.22.0 "$HOME/mlt"
      - name: Configure
        run: cmake --preset linux -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$HOME/mlt"
      - name: Build real Qt Quick editor and render helper
        run: cmake --build --preset linux --parallel 3
      - name: Run complete native test suite
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux --output-on-failure
      - name: Assemble dependency-containing AppImage
        run: bash packaging/linux/build-appimage.sh build/linux "$RUNNER_TEMP/linux-packages" "$HOME/mlt"
      - name: Verify portable AppImage execution outside build tree
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/linux-packages/FrameTrellis-linux-x86_64-EXPERIMENTAL.AppImage"
          sha256sum -c "$pkg.sha256"
          # Source media is generated by the real C++ renderer; no outside
          # copyrighted footage or secret input is ever uploaded.
          mkdir -p "$RUNNER_TEMP/synthetic"
          "$PWD/build/linux/bin/frametrellis-render" --self-test "$RUNNER_TEMP/synthetic"
          test -s "$RUNNER_TEMP/synthetic/self-test-export.mp4"
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
            -u FRAMETRELLIS_MLT_REPOSITORY -u MLT_REPOSITORY \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software SDL_AUDIODRIVER=dummy \
            "$pkg" --screenshot "$RUNNER_TEMP/linux-appimage-gui.png" \
            --screenshot-delay 1500 "$RUNNER_TEMP/synthetic/self-test.ftproj"
          test -s "$RUNNER_TEMP/linux-appimage-gui.png"
      - name: Upload explicitly experimental AppImage + checksums
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-EXPERIMENTAL-appimage-NOT-STABLE
          path: |
            ${{ runner.temp }}/linux-packages/*EXPERIMENTAL.AppImage
            ${{ runner.temp }}/linux-packages/*.sha256
            ${{ runner.temp }}/linux-packages/DEVELOPMENT-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload GUI smoke / test failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-experimental-appimage-evidence
          path: |
            ${{ runner.temp }}/linux-appimage-gui.png
            build/linux/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 14
