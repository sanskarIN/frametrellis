# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Windows (x64) packages — a portable ZIP and an installer — and verifies them on
# clean runners that have no development tools on the PATH. The release workflow calls this
# workflow and only publishes packages that passed every check.
name: Windows packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build packages
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Check Windows verification PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('packaging/windows/verify.ps1',
                              'packaging/windows/module-paths.ps1',
                              'scripts/windows/Collect-FrameTrellisCrashEvents.ps1',
                              'scripts/windows/FrameTrellisCrashTime.ps1',
                              'packaging/tests/test_crash_event_time.ps1')) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Test crash-event timezone correlation without reading event logs
        shell: pwsh
        run: ./packaging/tests/test_crash_event_time.ps1
      - name: Test Windows module path security boundaries
        shell: pwsh
        run: ./packaging/tests/test_verify_module_paths.ps1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # curl, git and zstd read the MSYS2 source packages of components that install no
          # license file of their own.
          install: curl git zstd
          pacboy: >-
            cc:p cmake:p ninja:p pkgconf:p python:p
            qt6-base:p qt6-declarative:p qt6-svg:p qt6-imageformats:p
            mlt:p fftw:p libebur128:p ffmpeg:p SDL2:p
      - name: Record the toolchain and library versions
        run: |
          mkdir -p dist
          pacman -Q | tee dist/msys2-packages.txt
      - name: Configure
        run: cmake --preset windows-msys2-release
      - name: Build
        run: cmake --build --preset windows-msys2-release
      - name: Test
        run: ctest --preset windows-msys2-release
      - name: Independently validate real MP4 video and non-silent AAC
        run: |
          set -euo pipefail
          mkdir -p dist/av-verification
          ./build/windows-msys2-release/bin/frametrellis-render.exe --self-test dist/av-verification
          python packaging/verify_export_media.py dist/av-verification/self-test-export.mp4
          # Validate *every* exposed stable-candidate output rate with an
          # independent FFprobe/FFmpeg implementation, not solely the render
          # helper's internal FPS check or the clean-host MP4 header smoke.
          # Match uses the generated self-test project's exact 25 FPS rate.
          for case in match:25 24:24 25:25 ntsc:30000/1001 30:30 60:60; do
            label="${case%%:*}"
            rate="${case#*:}"
            requested="$rate"
            if [[ "$label" == match ]]; then requested=match; fi
            output="dist/av-verification/output-${label}.mp4"
            ./build/windows-msys2-release/bin/frametrellis-render.exe \
              --project dist/av-verification/self-test.ftproj \
              --output "$output" --fps "$requested" --refuse-existing-output
            python packaging/verify_export_media.py "$output" \
              --fps "$rate" --width 640 --height 360 --duration 2
          done
          # Independently assert a custom even output width at NTSC rate.
          ./build/windows-msys2-release/bin/frametrellis-render.exe \
            --project dist/av-verification/self-test.ftproj \
            --output dist/av-verification/custom-ntsc.mp4 \
            --fps 30000/1001 --width 320 --refuse-existing-output
          python packaging/verify_export_media.py dist/av-verification/custom-ntsc.mp4 \
            --fps 30000/1001 --width 320 --height 180
      - name: Assemble the portable package
        run: python packaging/windows/package.py --build-dir build/windows-msys2-release --output dist
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | ForEach-Object Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # project() spans several lines, so match against the whole file.
          $cmake = Get-Content -Raw CMakeLists.txt
          if ($cmake -notmatch 'project\(FrameTrellis\s+VERSION\s+([0-9.]+)') {
            throw "Cannot read the project version from CMakeLists.txt"
          }
          $version = $Matches[1]
          $stage = Resolve-Path "dist\FrameTrellis-$version-windows-x64"
          & $iscc "/DAppVersion=$version" "/DStageDir=$stage" "/DOutputDir=$PWD\dist" "/DRepoDir=$PWD" packaging\windows\frametrellis.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist -File | Format-Table Name, Length
      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.spdx.json
            dist/*-sources.json
            dist/msys2-packages.txt
          if-no-files-found: error
          compression-level: 0
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-package-test-logs
          path: build/windows-msys2-release/Testing/Temporary/
          if-no-files-found: ignore

  verify:
    name: Verify on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Windows 11 on ARM64 runs the x64 build through Windows' x64 emulation.
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            packaging/windows
            scripts/windows
      - uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: dist
      - name: Verify the packages with only Windows on the PATH
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          # Probe intermittent native startup faults across all clean hosts:
          # five independent default-backend launches under x64-on-ARM and
          # three on each native x64 host. This is NOT a retry-until-success;
          # every failed launch still fails the whole verification.
          $isArm = "${{ matrix.os }}" -eq "windows-11-arm"
          $portableRuns = if ($isArm) { 5 } else { 3 }
          # On ARM compare software graphics and dummy SDL audio separately.
          ./packaging/windows/verify.ps1 -Zip $zip.FullName -Installer $setup.FullName `
            -WorkDir "$env:RUNNER_TEMP\ft" -Artifacts "$env:RUNNER_TEMP\ft-artifacts" `
            -Label "${{ matrix.os }}" -PortableGuiRuns $portableRuns `
            -SoftwareBackendDiagnostics:$isArm -DummyAudioDiagnostics:$isArm
      - name: Repeated real packaged-renderer exports (separate processes)
        shell: pwsh
        run: |
          # The previous verification generated only synthetic, disposable
          # source media and the corresponding self-test project. Reuse that
          # exact project to exercise three independent 30000/1001 FPS exports
          # from the *extracted portable package*, not from the build tree.
          $work = Join-Path $env:RUNNER_TEMP 'ft\verify packages'
          $portableRoot = Join-Path $work 'portable'
          $portableFolders = @(Get-ChildItem -LiteralPath $portableRoot -Directory)
          if ($portableFolders.Count -ne 1) {
            throw "Expected exactly one extracted portable package"
          }
          $renderer = Join-Path $portableFolders[0].FullName 'frametrellis-render.exe'
          $project = Join-Path $work 'self-test portable\self-test.ftproj'
          if (-not (Test-Path -LiteralPath $renderer -PathType Leaf) -or
              -not (Test-Path -LiteralPath $project -PathType Leaf)) {
            throw "The clean-host verification did not produce a portable renderer and test project"
          }
          # Prevent developer Qt/MLT DLLs from the hosted runner's PATH from
          # masking missing package dependencies. Keep Windows system paths.
          $env:PATH = @("$env:SystemRoot\System32", $env:SystemRoot,
            "$env:SystemRoot\System32\Wbem",
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0") -join ';'
          foreach ($name in @('QT_PLUGIN_PATH', 'QML_IMPORT_PATH',
              'QML2_IMPORT_PATH', 'QT_QPA_PLATFORM', 'QT_QUICK_BACKEND',
              'SDL_AUDIODRIVER', 'MLT_REPOSITORY', 'MLT_DATA',
              'FRAMETRELLIS_MLT_REPOSITORY')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $output = Join-Path $env:RUNNER_TEMP 'ft-artifacts\repeat-export'
          & ./scripts/windows/Test-FrameTrellisRepeatedExports.ps1 `
            -Renderer $renderer -Project $project -OutputDirectory $output `
            -Runs 3 -TimeoutSeconds 240 -Fps '30000/1001'
          if ($LASTEXITCODE -ne 0) {
            throw "Three consecutive packaged renderer exports did not all pass"
          }
          $summary = Get-Content -LiteralPath (
            Join-Path $output 'frametrellis-render-repro-summary.json') -Raw |
            ConvertFrom-Json
          $runs = @($summary.runs)
          if ($runs.Count -ne 3 -or
              @($runs | Where-Object { $_.status -ne 'success' -or
                                       $_.outputBytes -le 1024 }).Count -ne 0) {
            throw "Packaged repeated-renderer summary fails nonempty output gate"
          }
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ matrix.os }}
          path: ${{ runner.temp }}/ft-artifacts
          if-no-files-found: ignore
