# Builds the website (landing pages plus the documentation rendered from the repository's
# Markdown files), checks every internal link, and deploys it to GitHub Pages from main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "*.md"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
      - "*.md"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Look up the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases/latest" > release.json || echo '{}' > release.json
      - name: Build and check the links, including the download links
        run: node web/build.mjs --release-json release.json --verify-downloads
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
