# SPDX-License-Identifier: GPL-3.0-or-later
# One-time verified release publication bootstrap. Removed after dispatch succeeds.
name: Start FrameTrellis 1.2.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.2.0-once.yml"

permissions: {}

jobs:
  dispatch:
    name: Create tag and start verified release
    if: github.repository == 'sanskarIN/frametrellis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate version and create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0
        run: |
          set -euo pipefail
          project=$(grep -Pzo 'project\(FrameTrellis\s+VERSION\s+\K[0-9.]+' CMakeLists.txt | tr -d '\0')
          test "$project" = "1.2.0"
          test -s docs/releases/v1.2.0.md
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            existing=$(jq -r '.object.sha' tag.json)
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Refusing to move existing release tag ($existing) to $GITHUB_SHA"
              exit 1
            fi
            echo "Tag already exists and points at this commit."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > tag.json
            echo "Created $TAG at $GITHUB_SHA"
          fi
      - name: Dispatch full verified publishing pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.2.0 -f publish=true
          echo "Release workflow dispatched for v1.2.0."
