# SPDX-License-Identifier: GPL-3.0-or-later
# Manually rehearses a release and assembles all verified assets for a HUMAN to upload.
# This workflow NEVER creates a tag, GitHub release or release asset and has no
# push/tag/release triggers. Publication happens directly from the repository owner's
# GitHub Releases interface after acceptance, not from GitHub Actions.
name: Prepare manual release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release-rehearsal-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version and release notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.published.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Compare the tag with the project version
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # project() spans several lines; -z makes grep treat the file as one record.
          project=$(grep -Pzo 'project\(FrameTrellis\s+VERSION\s+\K[0-9.]+' CMakeLists.txt | tr -d '\0')
          if [ -z "$project" ]; then
            echo "::error::Cannot read the project version from CMakeLists.txt"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$project"
            if [ "$PUBLISH" = true ]; then
              echo "Publishing the verified release of $tag."
            else
              echo "Rehearsing the release of $tag; nothing will be published."
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          # Validate tag syntax, version match, and the base binary-package name.
          # A tag such as v1.4.0-beta.1 is published as that prerelease, but the
          # CMake/Inno package filename remains FrameTrellis-1.4.0-windows-x64.
          if ! python3 packaging/release_version.py --tag "$tag" \
                 --project-version "$project" >> "$GITHUB_OUTPUT"; then
            echo "::error::Invalid release tag or mismatched CMake version"
            exit 1
          fi
          version="${tag#v}"
          # A manual publish must run at the exact commit tagged for release.
          # A rehearsal does not require a tag and never publishes.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH" = true ]; then
            tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$tagged" ] || [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Published tag $tag must already point to this exact workflow commit"
              exit 1
            fi
          fi
          if [ ! -f "docs/releases/v${version%%-*}.md" ]; then
            echo "::error::Release notes docs/releases/v${version%%-*}.md are missing"
            exit 1
          fi
          # Refuse publication when a notes file is explicitly labelled DRAFT or
          # NOT RELEASED, including Markdown headings (not just HTML comments).
          # Check only the preamble so a historical link to draft notes in the body
          # does not accidentally block a legitimate release.
          notes="docs/releases/v${version%%-*}.md"
          if head -n 20 "$notes" | grep -qiE '(^<!--[[:space:]]*draft|^#[[:space:]].*(draft|not released)|^>.*(not published|not released))'; then
            echo "::error::Release notes $notes have a DRAFT / NOT RELEASED preamble"
            exit 1
          fi
          # tag/version/package_version already emitted by release_version.py
      - id: published
        name: Require a fresh verified asset assembly
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          build=true
          if { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$PUBLISH" = true ]; } &&
             gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null |
               grep -q -- '-windows-x64-setup\.exe$'; then
            echo "::notice::The packages of $TAG are already attached to its release; nothing to do."
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  packages:
    name: Windows packages
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/package-windows.yml

  sources:
    name: Collect corresponding source
    needs: [check, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-packages
          path: dist
      - name: Download the MSYS2 source packages of the bundled components
        run: |
          set -euo pipefail
          list=$(ls dist/*-sources.json)
          name=$(basename "$list" -sources.json)
          mkdir -p "sources/$name-third-party-sources"
          base=$(jq -r .base_url "$list")
          jq -r '.archives[]' "$list" | while read -r archive; do
            echo "Downloading $archive"
            curl --fail --silent --show-error --location --retry 3 \
              --output "sources/$name-third-party-sources/$archive" "$base$archive"
          done
          cp "$list" "sources/$name-third-party-sources/"
          tar -C sources -cf "dist/$name-third-party-sources.tar" "$name-third-party-sources"
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: windows-third-party-sources
          path: dist/*-third-party-sources.tar
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble manual upload bundle
    needs: [check, packages, sources]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      VERSION: ${{ needs.check.outputs.package_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true
      - name: Prepare the assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp assets/FrameTrellis-"$VERSION"-windows-x64-setup.exe \
             assets/FrameTrellis-"$VERSION"-windows-x64.zip \
             assets/FrameTrellis-"$VERSION"-windows-x64.spdx.json \
             assets/FrameTrellis-"$VERSION"-windows-x64-third-party-sources.tar \
             release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            echo "## Downloads"
            echo
            echo "| File | Description |"
            echo "|---|---|"
            echo "| \`FrameTrellis-$VERSION-windows-x64-setup.exe\` | Installer for Windows 10 (1809 or later) and Windows 11, x64 |"
            echo "| \`FrameTrellis-$VERSION-windows-x64.zip\` | Portable version: extract and run \`frametrellis.exe\` |"
            echo "| \`FrameTrellis-$VERSION-windows-x64.spdx.json\` | Software bill of materials (SPDX 2.3) of the Windows package |"
            echo "| \`FrameTrellis-$VERSION-windows-x64-third-party-sources.tar\` | Source packages of all bundled third-party components |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 checksums of the files above |"
            echo
            echo "The packages are not code-signed, so Windows SmartScreen may ask for confirmation"
            echo "before the first start. Compare the checksum first: in PowerShell, run"
            echo "\`Get-FileHash .\\FrameTrellis-$VERSION-windows-x64-setup.exe\` and check the value"
            echo "against \`SHA256SUMS.txt\`."
            echo
            echo "Linux and macOS: no packages yet. Build from source as described in"
            echo "[the building guide](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/development/building.md)."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > release-assets.md
          { cat "docs/releases/v${VERSION%%-*}.md"; echo; cat release-assets.md; } > release-notes.md
          cat release-notes.md
      - name: Upload complete verified files for manual GitHub publication
        uses: actions/upload-artifact@v6
        with:
          name: manual-release-assets
          path: |
            release/*
            release-notes.md
          if-no-files-found: error
          compression-level: 0
