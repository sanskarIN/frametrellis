<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <!-- FrameTrellis mark: staggered clips on three tracks form a trellis, crossed by a playhead. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d232c"/>
      <stop offset="1" stop-color="#0e1115"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fc8b0"/>
      <stop offset="1" stop-color="#5fe3cc"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a92e"/>
      <stop offset="1" stop-color="#f7c867"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7ef5"/>
      <stop offset="1" stop-color="#9aa6ff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="40" y="62" width="92" height="32" rx="9" fill="url(#teal)"/>
  <rect x="142" y="62" width="74" height="32" rx="9" fill="url(#teal)" fill-opacity="0.55"/>
  <rect x="70" y="112" width="116" height="32" rx="9" fill="url(#amber)"/>
  <rect x="40" y="162" width="56" height="32" rx="9" fill="url(#iris)" fill-opacity="0.55"/>
  <rect x="106" y="162" width="110" height="32" rx="9" fill="url(#iris)"/>
  <path d="M152 44 L152 212" stroke="#f4f6f8" stroke-width="5" stroke-linecap="round"/>
  <path d="M140 40 L164 40 L152 54 Z" fill="#f4f6f8" stroke="#f4f6f8" stroke-width="3" stroke-linejoin="round"/>
</svg>
